global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: evechat
    metrics_path: /metrics
    scheme: http
    bearer_token: "${EVECHAT_METRICS_TOKEN}"
    static_configs:
      - targets: ["127.0.0.1:3000"]
        labels:
          instance: evechat-prod
