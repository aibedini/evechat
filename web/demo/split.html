<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EveChat — تأخیر رفت‌وبرگشت</title>
  <link rel="stylesheet" href="/demo/demo.css" />
  <style>
    .bench { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-bottom: 18px; }
    .metric { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
    .metric b { display: block; font-size: 26px; }
    .metric span { color: var(--muted); font-size: 12px; }
    .demo-log { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 12px; max-height: 320px; overflow-y: auto; font-size: 12px; }
  </style>
</head>
<body>
<header class="demo-bar">
  <strong>⚡ دمو</strong>
  <a href="/demo">فروشگاه</a>
  <a href="/demo/split">تأخیر</a>
  <a href="/demo/devices">دستگاه‌ها</a>
  <a href="/demo/events">رویدادها</a>
  <a href="/demo/test">تست ساده</a>
  <span class="grow"></span>
  <button data-action="send">ارسال نمونه</button>
  <button data-action="clear">پاک کردن</button>
</header>
<main>
  <h1>تأخیر واقعی رفت‌وبرگشت</h1>
  <p>هر بار «ارسال نمونه» یک پیام واقعی می‌فرستد و تا رسیدن رویداد <code>message</code> زمان می‌گیرد؛ عددها میلی‌ثانیه و از <code>performance.now()</code> در همین مرورگر هستند.</p>
  <div class="bench">
    <div class="metric"><span>آخرین</span><b id="demo-latency">—</b></div>
    <div class="metric"><span>وضعیت اتصال</span><b id="demo-connection">—</b></div>
  </div>
  <pre id="demo-state" class="demo-log"></pre>
  <h2>رویدادها</h2>
  <div id="demo-log" class="demo-log"></div>
</main>
<script>window.__DEMO__ = { apiUrl: "__EVECHAT_API_URL__", projectKey: "__EVECHAT_PROJECT_KEY__" };</script>
<script src="/demo/demo.js"></script>
</body>
</html>
