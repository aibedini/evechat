<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/vazirmatn-variable.woff2" crossorigin />
    <link rel="stylesheet" href="/assets/fonts/vazirmatn.css" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("evechat:theme");
          var dark = saved === "dark" || (!saved && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <title>EveChat — پنل پشتیبانی</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
