name: Stale

on:
  schedule:
    - cron: "0 5 * * *"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-message: "این ایشو ۶۰ روز بدون فعالیت مانده است. اگر هنوز باز است، لطفاً به‌روزرسانی کنید."
          stale-pr-message: "این PR ۶۰ روز بدون فعالیت مانده است. لطفاً به‌روزرسانی کنید."
          close-issue-message: "به دلیل عدم فعالیت بسته شد؛ در صورت نیاز ایشو جدید باز کنید."
          exempt-issue-labels: "security,pinned"
