name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.1.0)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/widget/package-lock.json
            web/dashboard/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: build widget
        working-directory: web/widget
        run: |
          npm ci --no-audit --no-fund
          npm run build
          cp dist/widget.js ../../embed/widget/widget.js

      - name: build dashboard
        working-directory: web/dashboard
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: build setup wizard
        working-directory: web/setup
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: enforce widget budget
        run: |
          set -euo pipefail
          size=$(gzip -c embed/widget/widget.js | wc -c)
          budget=$(cat scripts/widget-budget.txt)
          echo "widget gzip: ${size} bytes (budget ${budget})"
          test "$size" -le "$budget"

      - name: resolve version        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: cross compile
        env:
          VERSION: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          V="${VERSION#v}"
          build() {
            goos="$1"; goarch="$2"; label="$3"; suffix="$4"; extra="${5:-}"
            name="evechat_${V}_${goos}_${label}${suffix}"
            if [ -n "$extra" ]; then export "$extra"; fi
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA::7} -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -o "dist/${name}" ./cmd/evechat
            mkdir -p "stage/${name}"
            cp "dist/${name}" evechat.example.yaml LICENSE README.md README.fa.md NOTICE "stage/${name}/"
            cp -r deploy "stage/${name}/deploy"
            if [ -n "$extra" ]; then unset "${extra%%=*}"; fi
            if [ "$goos" = "windows" ]; then
              (cd stage && zip -qr "../dist/${name}.zip" "${name}" && rm -rf "${name}")
            else
              tar -C stage -czf "dist/${name}.tar.gz" "${name}"
              rm -rf "stage/${name}"
            fi
          }
          build linux amd64 amd64 ""
          build linux arm64 arm64 ""
          build linux arm armv7 "" "GOARM=7"
          build darwin amd64 amd64 ""
          build darwin arm64 arm64 ""
          build windows amd64 amd64 ".exe"
          (cd dist && sha256sum * > checksums.txt)
          cp embed/widget/widget.js dist/widget.js
          ls -lh dist

      - name: release notes
        run: |
          tag="${{ steps.v.outputs.tag }}"
          ver="${tag#v}"
          awk -v t="$ver" 'BEGIN{p=0} /^## \[/{ if (index($0, "[" t "]") > 0) {p=1; next} else if (p) exit } p' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Release $tag" > notes.md; fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          body_path: notes.md
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/widget.js

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: image metadata
        id: meta
        run: |
          tag="${{ steps.v.outputs.tag }}"
          ver="${tag#v}"
          major_minor="${ver%.*}"
          echo "tags=ghcr.io/aibedini/evechat:${ver},ghcr.io/aibedini/evechat:${major_minor},ghcr.io/aibedini/evechat:latest" >> "$GITHUB_OUTPUT"

      - name: build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.v.outputs.tag }}

      - name: verify multi-arch manifest
        run: |
          set -euo pipefail
          tag="${{ steps.v.outputs.tag }}"
          ver="${tag#v}"
          docker buildx imagetools inspect "ghcr.io/aibedini/evechat:${ver}" --format '{{json .Manifest}}' > manifest.json
          node -e '
            const m = require("./manifest.json");
            const platforms = (m.manifests || []).map((x) => `${x.platform.os}/${x.platform.architecture}`);
            console.log("published platforms:", platforms.join(", "));
            for (const want of ["linux/amd64", "linux/arm64"]) {
              if (!platforms.includes(want)) {
                console.error("missing platform:", want);
                process.exit(1);
              }
            }
          '
