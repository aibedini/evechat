name: E2E install

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  fresh-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: build binary
        run: CGO_ENABLED=0 go build -o evechat ./cmd/evechat
      - name: install into a clean prefix
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/evechat"
          mkdir -p "$DIR"
          cp evechat "$DIR/"
          export EVECHAT_AUTH__JWT_SECRET="$(openssl rand -base64 48)"
          export EVECHAT_ENCRYPTION_KEY_V1="$(openssl rand -base64 32)"
          cat > "$DIR/evechat.yaml" <<EOF
          server:
            host: "127.0.0.1"
            port: 3210
            public_url: "http://127.0.0.1:3210"
          database:
            path: "$DIR/data/evechat.db"
          storage:
            uploads_dir: "$DIR/data/uploads"
          log:
            level: "warn"
          EOF
          mkdir -p "$DIR/data"
          "$DIR/evechat" --config "$DIR/evechat.yaml" setup --non-interactive --json \
            --admin-email ci@evechat.local --admin-password "CiPassword123!" --project-name CI > setup.json
          cat setup.json
          nohup "$DIR/evechat" --config "$DIR/evechat.yaml" serve > server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3210/api/v1/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3210/api/v1/health | tee health.json
          KEY=$(node -e "console.log(require('./setup.json').project_key)")
          node scripts/smoke.mjs http://127.0.0.1:3210 "$KEY" ci@evechat.local "CiPassword123!"
      - name: logs on failure
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/evechat/server.log"

  backup-restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: seed, backup, restore
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build -o evechat ./cmd/evechat
          DIR="$RUNNER_TEMP/e2e"; mkdir -p "$DIR/data"
          export EVECHAT_AUTH__JWT_SECRET="$(openssl rand -base64 48)"
          export EVECHAT_ENCRYPTION_KEY_V1="$(openssl rand -base64 32)"
          printf 'server:\n  host: "127.0.0.1"\n  port: 3211\n  public_url: "http://127.0.0.1:3211"\ndatabase:\n  path: "%s/data/evechat.db"\nstorage:\n  uploads_dir: "%s/data/uploads"\nlog:\n  level: "warn"\n' "$DIR" "$DIR" > "$DIR/evechat.yaml"
          ./evechat --config "$DIR/evechat.yaml" setup --non-interactive --json --admin-password "CiPassword123!" > setup.json
          ./evechat --config "$DIR/evechat.yaml" backup "$DIR/backup" --with-uploads
          ./evechat --config "$DIR/evechat.yaml" restore "$DIR/backup.tar.gz" --dry-run
          rm -f "$DIR/data/evechat.db"*
          ./evechat --config "$DIR/evechat.yaml" restore "$DIR/backup.tar.gz"
          # doctor exits 2 when it only finds warnings; accept 0/2 and let the
          # JSON decide, but never ignore any other exit code.
          set +e
          ./evechat --config "$DIR/evechat.yaml" doctor --json > doctor.json
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
          node -e "const r=require('./doctor.json'); console.log(r.summary); if (r.summary.fail > 0) process.exit(1)"

  offline-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: bundle
        run: make bundle
      - name: install without network
        run: |
          set -euo pipefail
          tar -xzf dist/evechat-offline-*.tar.gz -C "$RUNNER_TEMP"
          DIR=$(find "$RUNNER_TEMP" -maxdepth 1 -type d -name 'evechat-offline*' | head -n1)
          cd "$DIR"
          sudo ./install-offline.sh --dir "$RUNNER_TEMP/offline-install" --no-systemd
  behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: build binary
        run: CGO_ENABLED=0 go build -o evechat ./cmd/evechat
      - name: install playwright
        working-directory: web/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: start a throwaway instance
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/behavior"; mkdir -p "$DIR/data"
          export EVECHAT_AUTH__JWT_SECRET="$(openssl rand -base64 48)"
          export EVECHAT_ENCRYPTION_KEY_V1="$(openssl rand -base64 32)"
          export EVECHAT_RATELIMIT__WIDGET_SESSION_PER_MIN=600
          export EVECHAT_RATELIMIT__MESSAGE_PER_MIN=600
          export EVECHAT_RATELIMIT__LOGIN_PER_MIN=600
          export EVECHAT_SECURITY__POW_DIFFICULTY=0
          printf 'server:\n  host: "127.0.0.1"\n  port: 3212\n  public_url: "http://127.0.0.1:3212"\ndatabase:\n  path: "%s/data/evechat.db"\nstorage:\n  uploads_dir: "%s/data/uploads"\nlog:\n  level: "warn"\n' "$DIR" "$DIR" > "$DIR/evechat.yaml"
          ./evechat --config "$DIR/evechat.yaml" setup --non-interactive --json \
            --admin-email ci@evechat.local --admin-password "CiPassword123!" --project-name CI > /dev/null
          nohup ./evechat --config "$DIR/evechat.yaml" serve > "$DIR/server.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3212/api/v1/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3212/api/v1/health
      - name: behaviour suite
        working-directory: web/e2e
        env:
          EVECHAT_BASE: http://127.0.0.1:3212
          EVECHAT_ADMIN_EMAIL: ci@evechat.local
          EVECHAT_ADMIN_PASSWORD: CiPassword123!
        run: npx playwright test
      - name: server log on failure
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/behavior/server.log"

  wizard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: build binary
        run: CGO_ENABLED=0 go build -o evechat ./cmd/evechat
      - name: install playwright
        working-directory: web/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: start an unconfigured instance
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/wizard"; mkdir -p "$DIR/data"
          printf 'EVECHAT_AUTH__JWT_SECRET=%s\nEVECHAT_ENCRYPTION_KEY_V1=%s\n' \
            "$(openssl rand -base64 48)" "$(openssl rand -base64 32)" > "$DIR/.env"
          cat > "$DIR/evechat.yaml" <<'EOF'
          server:
            host: "127.0.0.1"
            port: 3214
            public_url: "http://127.0.0.1:3214"
            trust_proxy: true
            trusted_proxies:
              - "127.0.0.1/32"
              - "::1/128"
          database:
            path: "DATA_DIR/evechat.db"
          storage:
            uploads_dir: "DATA_DIR/uploads"
          log:
            level: "warn"
          EOF
          sed -i "s|DATA_DIR|$DIR/data|g" "$DIR/evechat.yaml"
          nohup ./evechat --config "$DIR/evechat.yaml" serve > "$DIR/server.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3214/api/v1/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3214/api/v1/health
          test -s "$DIR/data/setup-token.txt"
          echo "EVECHAT_SETUP_TOKEN=$(cat "$DIR/data/setup-token.txt")" >> "$GITHUB_ENV"
          echo "EVECHAT_BASE=http://127.0.0.1:3214" >> "$GITHUB_ENV"
      - name: wizard suite
        working-directory: web/e2e
        env:
          EVECHAT_WIZARD: "1"
        run: npx playwright test wizard.spec.ts
      - name: server log on failure
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/wizard/server.log"